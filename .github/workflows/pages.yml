name: Build & deploy registry to GitHub Pages

# Rebuilds the .perch catalog (dist/) with `npm run pack` and publishes it to
# GitHub Pages, so the whole dist/ tree — index.json plus every .perch, README,
# and icon — is served over HTTPS as a Perch registry source. dist/ is
# .gitignore'd and never committed; it is regenerated here on every push.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Least-privilege token the deploy-pages action needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time; a newer push supersedes an in-flight run
# rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typecheck + manifest validation BEFORE packing: this catalog is the
      # default registry for every Perch install, so a malformed
      # manifest here reaches every user. Failing the job leaves the last
      # good deployment serving instead.
      - run: npm run build
      - run: npm run check

      # pack runs `npm run build` first (esbuild-bundles code extensions),
      # then zips each extension into dist/<name>-<version>.perch and writes
      # dist/index.json — the catalog Perch's registry loader fetches.
      - run: npm run pack

      # ...and confirm what pack actually produced matches the manifests
      # (every .perch/README/icon the catalog references exists in dist/).
      - run: node scripts/check.mjs --dist

      # enablement: true turns Pages on via the API if it isn't already,
      # so the first run doesn't require flipping Settings → Pages by hand.
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
